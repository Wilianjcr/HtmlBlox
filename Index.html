<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>

<meta name="description" content="Editor seguro de módulos HTML — edite blocos individualmente sem quebrar a estrutura."/>
<title>HtmlBlox</title>

<!-- ── PWA Manifest (inline blob — funciona sem servidor) ── -->
<script>
(function(){
  /* ícone SVG 512×512 do HtmlBlox — grade de blocos + raio âncora */
  const ICON_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
    <rect width="512" height="512" rx="96" fill="#0b0d12"/>
    <!-- bloco superior-esquerdo (laranja) -->
    <rect x="60"  y="60"  width="176" height="176" rx="20" fill="#f0a500"/>
    <!-- bloco superior-direito (escuro com borda) -->
    <rect x="276" y="60"  width="176" height="176" rx="20" fill="#1a1e2b" stroke="#f0a500" stroke-width="8"/>
    <!-- bloco inferior-esquerdo (escuro) -->
    <rect x="60"  y="276" width="176" height="176" rx="20" fill="#1a1e2b" stroke="#2e3348" stroke-width="8"/>
    <!-- bloco inferior-direito (menor, acento) -->
    <rect x="276" y="276" width="80"  height="80"  rx="14" fill="#f0a500" opacity=".4"/>
    <rect x="372" y="276" width="80"  height="80"  rx="14" fill="#1a1e2b" stroke="#f0a500" stroke-width="6"/>
    <rect x="276" y="372" width="80"  height="80"  rx="14" fill="#1a1e2b" stroke="#f0a500" stroke-width="6"/>
    <rect x="372" y="372" width="80"  height="80"  rx="14" fill="#f0a500"/>
    <!-- chevron no bloco laranja principal -->
    <path d="M108 158 L152 108 L196 158" stroke="#0b0d12" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M108 178 L152 228 L196 178" stroke="#0b0d12" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </svg>`;

  const iconB64 = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(ICON_SVG)));

  /* Apple touch icon */
  const appleLink = document.createElement('link');
  appleLink.rel = 'apple-touch-icon';
  appleLink.href = iconB64;
  document.head.appendChild(appleLink);

  /* Favicon */
  const favicon = document.createElement('link');
  favicon.rel = 'icon'; favicon.type = 'image/svg+xml';
  favicon.href = iconB64;
  document.head.appendChild(favicon);

  /* Manifest blob */
  const manifest = {
    name: "HtmlBlox — Editor de Módulos",
    short_name: "HtmlBlox",
    description: "Editor seguro de módulos HTML",
    start_url: "./",
    display: "standalone",
    background_color: "#0b0d12",
    theme_color: "#f0a500",
    orientation: "any",
    icons: [
      { src: iconB64, sizes: "192x192", type: "image/svg+xml", purpose: "any maskable" },
      { src: iconB64, sizes: "512x512", type: "image/svg+xml", purpose: "any maskable" }
    ]
  };
  const blob = new Blob([JSON.stringify(manifest)], {type:'application/manifest+json'});
  const manifestLink = document.createElement('link');
  manifestLink.rel = 'manifest';
  manifestLink.href = URL.createObjectURL(blob);
  document.head.appendChild(manifestLink);
})();
</script>

<!-- ── Service Worker inline ── -->
<script>
if ('serviceWorker' in navigator) {
  const SW_CODE = `
    const CACHE = 'htmlblox-v1';
    self.addEventListener('install', e => {
      self.skipWaiting();
    });
    self.addEventListener('fetch', e => {
      e.respondWith(
        caches.match(e.request).then(r => r || fetch(e.request).catch(() => new Response('Offline')))
      );
    });
  `;
  const swBlob = new Blob([SW_CODE], {type:'text/javascript'});
  const swUrl  = URL.createObjectURL(swBlob);
  navigator.serviceWorker.register(swUrl, {scope: './'}).catch(() => {});
}
</script>

<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<script>window.tailwind={};window.tailwind.config={theme:{extend:{fontFamily:{ui:['Syne','sans-serif'],code:['JetBrains Mono','monospace']}}}};</script>
<script src="https://cdn.tailwindcss.com"></script>

<style>
/* ════════════════════════════════════════════════════════
   TOKENS
════════════════════════════════════════════════════════ */
:root {
  --bg:       #0b0d12;
  --s1:       #13161f;   /* surface 1 */
  --s2:       #1a1e2b;   /* surface 2 */
  --s3:       #222636;   /* border */
  --s4:       #2e3348;   /* border hover */
  --accent:   #f0a500;
  --accent-d: #c88a00;
  --text:     #dde2f0;
  --dim:      #6b7491;
  --muted:    #3d4460;
  --danger:   #f87171;
  --info:     #60a5fa;
  --success:  #34d399;

  --hdr: 54px;
  --ftr: 52px;
  --r:   12px;           /* border-radius padrão */

  /* desktop: largura da coluna de edição (arrastável) */
  --col: clamp(320px, 38vw, 520px);
}

*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html,body { height:100%; }

body {
  font-family:'Syne',sans-serif;
  background:var(--bg);
  color:var(--text);
  display:grid;
  grid-template-rows: var(--hdr) 1fr var(--ftr);
  height:100dvh;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}

/* scrollbars */
::-webkit-scrollbar { width:4px; height:4px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--s4); border-radius:4px; }
::-webkit-scrollbar-thumb:hover { background:var(--accent); }

/* ════════════════════════════════════════════════════════
   HEADER
════════════════════════════════════════════════════════ */
#hdr {
  grid-row:1;
  background:var(--s1);
  border-bottom:1px solid var(--s3);
  display:flex; align-items:center; justify-content:space-between;
  padding:0 14px; gap:10px;
  position:relative; z-index:60;
}
.logo { display:flex; align-items:center; gap:10px; flex-shrink:0; }

/* ── ícone do logo no header ── */
.logo-icon {
  width:34px; height:34px; border-radius:9px; flex-shrink:0;
  background:var(--accent);
  display:flex; align-items:center; justify-content:center;
  position:relative; overflow:hidden;
}
.logo-icon svg { width:22px; height:22px; }

.logo-name {
  font-weight:800; font-size:16px; letter-spacing:-.4px; color:var(--text);
}
.logo-tagline {
  font-size:10px; color:var(--dim); font-weight:600;
  background:var(--s2); border:1px solid var(--s3);
  padding:2px 7px; border-radius:99px;
}

#hdr-right { display:flex; align-items:center; gap:6px; flex-shrink:0; }

/* status badge */
#status-pill {
  font-family:'JetBrains Mono',monospace; font-size:10px;
  color:var(--dim); background:var(--bg); border:1px solid var(--s3);
  border-radius:99px; padding:3px 10px;
  max-width:160px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
@media(max-width:640px){#status-pill{display:none;}}

/* ════════════════════════════════════════════════════════
   WORKSPACE
════════════════════════════════════════════════════════ */
#workspace {
  grid-row:2;
  display:grid;
  grid-template-columns:var(--col) 1fr;
  overflow:hidden;
  position:relative;
}

/* ── coluna editor ── */
#col-edit {
  display:flex; flex-direction:column;
  overflow:hidden;
  border-right:1px solid var(--s3);
}

/* toolbar do editor */
#edit-tb {
  flex-shrink:0;
  display:flex; align-items:center; justify-content:space-between;
  padding:8px 14px;
  background:var(--s1);
  border-bottom:1px solid var(--s3);
  gap:8px;
}
.tb-left  { display:flex; align-items:center; gap:8px; }
.tb-right { display:flex; align-items:center; gap:6px; }

/* lista de módulos — scroll */
#modules-list {
  flex:1; overflow-y:auto;
  padding:16px 14px;
  display:flex; flex-direction:column;
  gap:14px;             /* espaço entre cards — desktop */
}

/* ── coluna preview ── */
#col-preview {
  display:flex; flex-direction:column; overflow:hidden;
}
#prev-tb {
  flex-shrink:0;
  display:flex; align-items:center; justify-content:space-between;
  padding:8px 14px;
  background:var(--s1); border-bottom:1px solid var(--s3);
}
.tl-wrap { display:flex; align-items:center; gap:5px; }
.tl { width:10px; height:10px; border-radius:50%; opacity:.75; }
#prev-wrap { flex:1; position:relative; overflow:hidden; }
#prev-iframe { width:100%; height:100%; border:none; background:#fff; display:none; }
#prev-empty {
  position:absolute; inset:0;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  gap:14px; color:var(--muted); text-align:center; padding:40px;
}
#prev-empty svg { opacity:.3; }

/* ── resize handle ── */
#rh {
  position:absolute; left:var(--col); top:0; bottom:0;
  width:8px; cursor:col-resize; z-index:10;
  background:transparent; transition:background .15s;
}
#rh:hover,#rh.drag { background:rgba(240,165,0,.18); }
@media(max-width:768px){#rh{display:none;}}

/* ════════════════════════════════════════════════════════
   MOBILE — abas Editar | Preview
════════════════════════════════════════════════════════ */
@media(max-width:768px){
  body {
    grid-template-rows: var(--hdr) auto 1fr var(--ftr);
    height:100dvh;
  }

  #mob-tabs {
    grid-row:2;
    display:flex;
    background:var(--s1); border-bottom:1px solid var(--s3);
  }
  .mob-tab {
    flex:1; display:flex; align-items:center; justify-content:center; gap:7px;
    padding:11px 8px;
    font-family:'Syne',sans-serif; font-size:13px; font-weight:700;
    color:var(--dim); background:transparent; border:none; cursor:pointer;
    border-bottom:2.5px solid transparent;
    transition:color .15s, border-color .15s;
  }
  .mob-tab.active { color:var(--accent); border-bottom-color:var(--accent); }

  #workspace {
    grid-row:3;
    grid-template-columns:1fr;
    grid-template-rows:1fr;
  }
  #col-edit,#col-preview {
    grid-column:1; grid-row:1;
    border-right:none;
  }
  .mob-hidden { display:none !important; }

  /* ── módulos no mobile: cada card ocupa ~30dvh ── */
  #modules-list {
    padding:14px 12px;
    gap:16px;           /* separação generosa entre cards */
  }
  .mod-card {
    /* card cresce para preencher bem a tela */
    min-height:calc(100dvh * 0.30);
  }
  .mod-ta {
    /* textarea cresce junto com o card */
    min-height:calc(100dvh * 0.18) !important;
    font-size:12px !important;
    line-height:1.75 !important;
  }
  .mod-head { padding:13px 14px; }
  .mod-body { padding:12px 12px 10px; }

  /* FAB executar */
  #fab-run {
    display:flex !important;
    position:fixed;
    bottom:calc(var(--ftr) + 16px); right:16px;
    width:56px; height:56px; border-radius:50%;
    background:var(--accent); color:#0b0d12;
    align-items:center; justify-content:center;
    box-shadow:0 6px 28px rgba(240,165,0,.45);
    border:none; cursor:pointer; z-index:200;
    transition:transform .15s, box-shadow .15s;
  }
  #fab-run:active { transform:scale(.9); }
}
@media(min-width:769px){
  #mob-tabs { display:none; }
  #fab-run  { display:none !important; }
}

/* ════════════════════════════════════════════════════════
   FOOTER — tab bar de seções
════════════════════════════════════════════════════════ */
#footer {
  grid-row:3;
  background:var(--s1); border-top:1px solid var(--s3);
  display:flex; align-items:center;
  padding:0 8px 0 12px; gap:0;
  overflow-x:auto; overflow-y:hidden;
  scrollbar-width:none; -webkit-overflow-scrolling:touch;
}
#footer::-webkit-scrollbar { display:none; }
@media(max-width:768px){ #footer{ grid-row:4; } }

.sec-tab {
  display:inline-flex; align-items:center; gap:7px;
  height:var(--ftr); padding:0 14px;
  font-family:'Syne',sans-serif; font-size:12px; font-weight:700;
  color:var(--dim); white-space:nowrap; cursor:pointer;
  border:none; background:transparent;
  border-bottom:2.5px solid transparent;
  transition:color .15s, border-color .15s;
}
.sec-tab:hover { color:var(--text); }
.sec-tab.active { color:var(--accent); border-bottom-color:var(--accent); }
.sdot {
  width:8px; height:8px; border-radius:50%; flex-shrink:0;
  transition:transform .2s;
}
.sec-tab.active .sdot { transform:scale(1.3); }
.sclose {
  width:17px; height:17px; border-radius:4px;
  display:flex; align-items:center; justify-content:center;
  font-size:11px; color:var(--muted);
  opacity:0; transition:opacity .12s, background .12s;
}
.sec-tab:hover .sclose { opacity:1; }
.sclose:hover { background:rgba(248,113,113,.15); color:var(--danger); }
.dpill {
  width:7px; height:7px; border-radius:50%;
  background:var(--info); flex-shrink:0;
  animation:blink 2.2s ease infinite;
}
@keyframes blink{ 0%,100%{opacity:1;} 50%{opacity:.3;} }

#ftr-sep { width:1px; height:26px; background:var(--s3); margin:0 6px; flex-shrink:0; }
#btn-ns {
  display:inline-flex; align-items:center; gap:5px;
  height:32px; padding:0 13px;
  font-family:'Syne',sans-serif; font-size:11px; font-weight:700;
  color:var(--dim); background:var(--s2); border:1px solid var(--s3);
  border-radius:7px; cursor:pointer; flex-shrink:0; margin-left:4px;
  transition:color .15s, background .15s, border-color .15s;
}
#btn-ns:hover { color:var(--accent); background:var(--bg); border-color:var(--accent); }

/* ════════════════════════════════════════════════════════
   MÓDULO CARD
════════════════════════════════════════════════════════ */
.mod-card {
  background:var(--s1);
  border:1px solid var(--s3);
  border-radius:var(--r);
  overflow:hidden;
  position:relative;
  transition:border-color .2s, box-shadow .2s;
  animation:cin .22s ease both;
}
@keyframes cin{ from{opacity:0;transform:translateY(8px);} to{opacity:1;transform:none;} }

/* barra colorida esquerda */
.mod-card::before {
  content:''; position:absolute;
  left:0; top:0; bottom:0; width:4px;
  background:var(--mc, var(--accent));
  transition:width .2s;
}
.mod-card:focus-within {
  border-color:var(--mc, var(--accent));
  box-shadow:0 0 0 1.5px color-mix(in srgb,var(--mc,var(--accent)) 22%,transparent),
             0 6px 24px rgba(0,0,0,.35);
}
.mod-card:focus-within::before { width:5px; }

/* separador visual entre cards (linha de grade) */
.mod-card + .mod-card::after {
  content:'';
  display:block;
  height:1px;
  background:linear-gradient(90deg,var(--mc,var(--s4)) 0%,transparent 100%);
  position:absolute; top:-8px; left:0; right:0; opacity:.25;
}

/* ── cabeçalho ── */
.mod-head {
  display:flex; align-items:center; justify-content:space-between;
  padding:11px 13px 11px 16px;
  background:var(--s2);
  border-bottom:1px solid var(--s3);
  gap:8px; user-select:none;
}
.mhl { display:flex; align-items:center; gap:8px; min-width:0; }
.mcdot {
  width:9px; height:9px; border-radius:50%; flex-shrink:0;
  background:var(--mc);
  box-shadow:0 0 8px var(--mc);
}
.mname {
  font-size:13px; font-weight:700; color:var(--text);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.mnum {
  font-family:'JetBrains Mono',monospace; font-size:10px;
  color:var(--muted); background:var(--bg); border:1px solid var(--s3);
  padding:2px 7px; border-radius:4px; flex-shrink:0;
}
.mdirty {
  font-size:9px; font-weight:700; letter-spacing:.06em;
  color:var(--info); background:rgba(96,165,250,.1);
  border:1px solid rgba(96,165,250,.25);
  padding:2px 7px; border-radius:4px; flex-shrink:0;
}

/* ── ações do card ── */
.mact { display:flex; align-items:center; gap:4px; flex-shrink:0; }
.mbtn {
  display:inline-flex; align-items:center; gap:4px;
  height:28px; padding:0 10px;
  font-family:'Syne',sans-serif; font-size:11px; font-weight:700;
  border-radius:6px; border:1px solid var(--s3);
  cursor:pointer; white-space:nowrap; background:transparent; color:var(--dim);
  transition:background .12s, color .12s, border-color .12s, transform .1s;
  -webkit-tap-highlight-color:transparent;
}
.mbtn:active { transform:scale(.93); }
.mbtn-reset:hover { background:rgba(96,165,250,.1); color:var(--info); border-color:rgba(96,165,250,.3); }
.mbtn-clear:hover { background:rgba(248,113,113,.08); color:var(--danger); border-color:rgba(248,113,113,.25); }
.mbtn-del:hover   { background:rgba(248,113,113,.12); color:var(--danger); border-color:rgba(248,113,113,.3); }
.mbtn-del { padding:0 8px; }
/* collapsar */
.cbtn {
  background:transparent; border:none; cursor:pointer;
  color:var(--dim); padding:0 4px; font-size:16px; line-height:1;
  transition:color .12s, transform .22s;
  -webkit-tap-highlight-color:transparent;
}
.cbtn:hover { color:var(--text); }
.mod-card.collapsed .cbtn { transform:rotate(-90deg); }
.mod-card.collapsed .mod-body { display:none; }
.mod-card.collapsed .mod-head { border-bottom:none; }

/* ── corpo do card ── */
.mod-body { padding:12px 12px 10px 16px; }

/* ── textarea ── */
.mod-ta {
  font-family:'JetBrains Mono',monospace;
  font-size:11.5px; line-height:1.72;
  resize:vertical; min-height:130px;
  background:var(--bg); color:#b8c0dc;
  border:1px solid var(--s3); border-radius:8px;
  padding:11px 13px; width:100%; outline:none;
  transition:border-color .18s, box-shadow .18s;
  -webkit-appearance:none;
}
.mod-ta:focus {
  border-color:var(--mc, var(--accent));
  box-shadow:0 0 0 2.5px color-mix(in srgb,var(--mc,var(--accent)) 12%,transparent);
}
.mod-ta.dirty { border-color:rgba(96,165,250,.55); }
.mod-ta.empty { border-color:rgba(248,113,113,.45); background:rgba(248,113,113,.03); }
.mod-hint {
  margin-top:6px;
  font-family:'JetBrains Mono',monospace;
  font-size:10px; color:var(--muted);
}

/* ════════════════════════════════════════════════════════
   BOTÕES GLOBAIS
════════════════════════════════════════════════════════ */
.btn {
  display:inline-flex; align-items:center; gap:5px;
  font-family:'Syne',sans-serif; font-weight:700;
  border:none; cursor:pointer; border-radius:8px;
  transition:transform .1s, opacity .15s, background .15s, box-shadow .15s;
  white-space:nowrap; line-height:1;
  -webkit-tap-highlight-color:transparent;
}
.btn:active { transform:scale(.94); }
.btn-p { background:var(--accent); color:#0b0d12; padding:8px 16px; font-size:13px; box-shadow:0 2px 14px rgba(240,165,0,.3); }
.btn-p:hover { opacity:.86; box-shadow:0 4px 22px rgba(240,165,0,.45); }
.btn-g { background:var(--s2); color:var(--text); border:1px solid var(--s3); padding:7px 13px; font-size:12px; }
.btn-g:hover { background:var(--s4); }
.btn-xs { padding:5px 11px; font-size:11px; border-radius:6px; }

.tag {
  font-family:'JetBrains Mono',monospace; font-size:10px; font-weight:500;
  padding:2px 9px; border-radius:5px;
  border:1px solid var(--s3); background:var(--bg); color:var(--dim);
}

/* ════════════════════════════════════════════════════════
   EMPTY STATE
════════════════════════════════════════════════════════ */
.empty {
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  gap:12px; text-align:center; padding:48px 28px;
  color:var(--muted); height:100%;
}
.empty svg { opacity:.3; }
.empty b { color:var(--accent); }

/* ════════════════════════════════════════════════════════
   MODAL
════════════════════════════════════════════════════════ */
#modal-ov {
  display:none; position:fixed; inset:0;
  background:rgba(0,0,0,.72);
  backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  z-index:9000; align-items:center; justify-content:center; padding:16px;
}
#modal-ov.open { display:flex; }
#modal-box {
  background:var(--s1); border:1px solid var(--s4);
  border-radius:16px; padding:26px;
  width:100%; max-width:520px; max-height:90dvh;
  overflow-y:auto;
  box-shadow:0 28px 90px rgba(0,0,0,.65);
  animation:min .2s ease;
}
@keyframes min{ from{opacity:0;transform:translateY(18px) scale(.96);} to{opacity:1;transform:none;} }
.m-title { font-size:16px; font-weight:800; color:var(--text); margin-bottom:20px; }
.f-label {
  display:block; font-size:10px; font-weight:700;
  letter-spacing:.08em; text-transform:uppercase; color:var(--dim); margin-bottom:6px;
}
.f-in {
  width:100%; background:var(--bg); color:var(--text);
  border:1px solid var(--s4); border-radius:8px; padding:11px 13px;

<!-- ════════════════════════════════════════════════════════
  JAVASCRIPT

<script>
/* ── Paleta & constantes ── */
const PAL = ['#f0a500','#60a5fa','#34d399','#a78bfa','#f87171','#38bdf8','#fb923c','#a3e635'];

/* ── Estado ── */
const APP = {
  sections:  new Map(),
  activeId:  null,
  modalMode: null,
  mobView:   'edit',
  nextId:    1,
  deferredPWA: null,
};

/* ══════════════════════════════════════════════════════
   PWA — captura o evento beforeinstallprompt
══════════════════════════════════════════════════════ */
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  APP.deferredPWA = e;

  // Exibe o banner após 1.8 s (dá tempo da UI carregar)
  setTimeout(() => {
    if (!localStorage.getItem('pwa-dismissed')) showPWABanner();
  }, 1800);
});

function showPWABanner() {
  const b = document.getElementById('pwa-banner');
  b.classList.add('visible');
}

document.getElementById('pwa-install').addEventListener('click', async () => {
  const b = document.getElementById('pwa-banner');
  b.classList.remove('visible');
  if (!APP.deferredPWA) return;
  APP.deferredPWA.prompt();
  const { outcome } = await APP.deferredPWA.userChoice;
  if (outcome === 'accepted') showToast('🎉 HtmlBlox instalado com sucesso!');
  APP.deferredPWA = null;
});

function dismissPWA() {
  document.getElementById('pwa-banner').classList.remove('visible');
  localStorage.setItem('pwa-dismissed', '1');
}

// já instalado
window.addEventListener('appinstalled', () => {
  document.getElementById('pwa-banner').classList.remove('visible');
  showToast('✅ App instalado!');
});

/* ══════════════════════════════════════════════════════
   INIT
══════════════════════════════════════════════════════ */
document.addEventListener('DOMContentLoaded', () => {
  const sec = createSection('Boletim 19/05', MOCK_HTML, PAL[0]);
  APP.sections.set(sec.id, sec);
  APP.activeId = sec.id;
  renderAll();
  initResize();
});

/* ══════════════════════════════════════════════════════
   SEÇÃO
══════════════════════════════════════════════════════ */
function createSection(name, rawHTML, color) {
  const id = 's' + (APP.nextId++);
  const { parsedDoc, modules } = parseHTML(rawHTML);
  return { id, name, color, rawHTML, parsedDoc, modules };
}

function parseHTML(html) {
  const parser    = new DOMParser();
  const parsedDoc = parser.parseFromString(html, 'text/html');
  const modules   = Array.from(parsedDoc.querySelectorAll('[data-modulo]')).map(node => ({
    nome: node.getAttribute('data-modulo'),
    node, originalHTML: node.outerHTML, currentHTML: node.outerHTML,
  }));
  return { parsedDoc, modules };
}

/* ══════════════════════════════════════════════════════
   RENDER
══════════════════════════════════════════════════════ */
function renderAll() { renderTabs(); renderModules(); }

function renderTabs() {
  const footer = document.getElementById('footer');
  const sep    = document.getElementById('ftr-sep');
  footer.querySelectorAll('.sec-tab,.stab-sep').forEach(e => e.remove());

  let i = 0;
  APP.sections.forEach(sec => {
    const active = sec.id === APP.activeId;
    const dirty  = sec.modules.some(m => m.currentHTML !== m.originalHTML);
    const tab = document.createElement('button');
    tab.className = 'sec-tab' + (active ? ' active' : '');
    tab.innerHTML =
      `<span class="sdot" style="background:${sec.color};"></span>` +
      `<span>${esc(sec.name)}</span>` +
      (dirty  ? `<span class="dpill" title="Edições pendentes"></span>` : '') +
      (APP.sections.size > 1
        ? `<span class="sclose" onclick="closeSection(event,'${sec.id}')" title="Fechar">✕</span>` : '');
    tab.onclick = e => { if (e.target.closest('.sclose')) return; switchSection(sec.id); };
    if (i > 0) {
      const sp = document.createElement('div');
      sp.className = 'stab-sep';
      sp.style.cssText = 'width:1px;height:22px;background:var(--s3);flex-shrink:0;margin:0 2px;';
      footer.insertBefore(sp, sep);
    }
    footer.insertBefore(tab, sep);
    i++;
  });
}

function renderModules() {
  const sec   = activeSec();
  const list  = document.getElementById('modules-list');
  const count = document.getElementById('mod-count');
  const mc    = document.getElementById('mob-cnt');

  if (!sec) {
    count.textContent = '0';
    list.innerHTML = `<div class="empty"><p>Nenhuma seção ativa.</p></div>`;
    return;
  }
  count.textContent = sec.modules.length;
  if (mc) mc.textContent = sec.modules.length ? `(${sec.modules.length})` : '';

  if (!sec.modules.length) {
    list.innerHTML = `
      <div class="empty">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none">
          <rect x="3" y="3" width="18" height="18" rx="3" stroke="currentColor" stroke-width="1.2"/>
          <path d="M8 8h8M8 12h5M8 16h3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
        <div><p style="font-size:13px;font-weight:700;color:var(--dim);margin-bottom:6px;">Seção vazia</p>
          <p style="font-size:12px;">Clique em <b>Novo módulo</b> para adicionar.</p></div>
      </div>`;
    return;
  }

  list.innerHTML = sec.modules.map((mod, i) => {
    const c = PAL[i % PAL.length];
    const dirty = mod.currentHTML !== mod.originalHTML;
    const empty = mod.currentHTML.trim() === '';
    return `
<div class="mod-card" id="mc-${sec.id}-${i}" style="--mc:${c};animation-delay:${i*45}ms;">
  <div class="mod-head">
    <div class="mhl">
      <button class="cbtn" onclick="toggleCol('${sec.id}',${i})" title="Expandir/Colapsar">▾</button>
      <span class="mcdot"></span>
      <span class="mname" title="${esc(mod.nome)}">${esc(mod.nome)}</span>
      <span class="mnum">#${i+1}</span>
      ${dirty ? `<span class="mdirty">editado</span>` : ''}
    </div>
    <div class="mact">
      <button class="mbtn mbtn-reset" onclick="resetMod('${sec.id}',${i})" title="Restaurar original">
        <svg width="10" height="10" viewBox="0 0 16 16" fill="none"><path d="M3 8a5 5 0 1 0 1-3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M3 3v3h3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Reset
      </button>
      <button class="mbtn mbtn-clear" onclick="clearMod('${sec.id}',${i})" title="Limpar">
        <svg width="10" height="10" viewBox="0 0 16 16" fill="none"><path d="M3 4h10M6 4V3h4v1M5 4l1 9h4l1-9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Limpar
      </button>
      <button class="mbtn mbtn-del" onclick="removeMod('${sec.id}',${i})" title="Remover">
        <svg width="11" height="11" viewBox="0 0 16 16" fill="none"><path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>
  <div class="mod-body">
    <textarea id="ta-${sec.id}-${i}"
      class="mod-ta${dirty?' dirty':''}${empty?' empty':''}"
      rows="7" spellcheck="false" autocorrect="off" autocapitalize="off"
      oninput="onTa('${sec.id}',${i},this)"
    >${esc(mod.currentHTML)}</textarea>
    <p class="mod-hint">Edite este bloco · o documento completo é preservado automaticamente</p>
  </div>
</div>`;
  }).join('');
}

/* ══════════════════════════════════════════════════════
   EVENTOS
══════════════════════════════════════════════════════ */
function onTa(secId, idx, el) {
  const sec = APP.sections.get(secId); if (!sec) return;
  const mod = sec.modules[idx];        if (!mod) return;
  mod.currentHTML = el.value;
  const dirty = el.value !== mod.originalHTML;
  const empty = el.value.trim() === '';
  el.classList.toggle('dirty', dirty && !empty);
  el.classList.toggle('empty', empty);
  const card = document.getElementById(`mc-${secId}-${idx}`);
  if (card) {
    let badge = card.querySelector('.mdirty');
    if (dirty && !badge) {
      badge = Object.assign(document.createElement('span'), { className:'mdirty', textContent:'editado' });
      card.querySelector('.mname')?.after(badge);
    } else if (!dirty && badge) badge.remove();
  }
  renderTabs();
}

function toggleCol(secId, idx) {
  document.getElementById(`mc-${secId}-${idx}`)?.classList.toggle('collapsed');
}

function mobTab(v) {
  APP.mobView = v;
  document.getElementById('col-edit').classList.toggle('mob-hidden', v !== 'edit');
  document.getElementById('col-preview').classList.toggle('mob-hidden', v !== 'preview');
  document.getElementById('mte').classList.toggle('active', v === 'edit');
  document.getElementById('mtp').classList.toggle('active', v === 'preview');
  document.getElementById('fab-run').style.display = v === 'edit' ? 'flex' : 'none';
}

function switchSection(id) {
  APP.activeId = id;
  renderAll(); clearPrev();
}

/* ══════════════════════════════════════════════════════
   AÇÕES
══════════════════════════════════════════════════════ */
function resetMod(secId, idx) {
  const mod = APP.sections.get(secId)?.modules[idx]; if (!mod) return;
  mod.currentHTML = mod.originalHTML;
  const ta = document.getElementById(`ta-${secId}-${idx}`);
  if (ta) { ta.value = mod.originalHTML; ta.classList.remove('dirty','empty'); }
  document.getElementById(`mc-${secId}-${idx}`)?.querySelector('.mdirty')?.remove();
  renderTabs();
  showToast(`↩ "${mod.nome}" restaurado`);
}

function clearMod(secId, idx) {
  const mod = APP.sections.get(secId)?.modules[idx]; if (!mod) return;
  mod.currentHTML = '';
  const ta = document.getElementById(`ta-${secId}-${idx}`);
  if (ta) { ta.value = ''; ta.classList.add('empty'); ta.classList.remove('dirty'); }
  renderTabs();
  showToast(`🗑 "${mod.nome}" limpo`);
}

function removeMod(secId, idx) {
  const sec = APP.sections.get(secId); if (!sec) return;
  const nome = sec.modules[idx]?.nome;
  sec.modules.splice(idx, 1);
  renderModules(); renderTabs();
  showToast(`✖ Módulo "${nome}" removido`);
}

function clearSection() {
  const sec = activeSec(); if (!sec) return;
  if (!sec.modules.length) { showToast('⚠ Seção já vazia'); return; }
  if (!confirm(`Limpar ${sec.modules.length} módulo(s) da seção "${sec.name}"?`)) return;
  sec.modules = [];
  renderModules(); renderTabs();
  showToast(`🧹 Seção limpa`);
}

function closeSection(ev, id) {
  ev.stopPropagation();
  if (APP.sections.size <= 1) { showToast('⚠ Mínimo de uma seção'); return; }
  const sec = APP.sections.get(id);
  if (!confirm(`Fechar "${sec.name}"?`)) return;
  APP.sections.delete(id);
  if (APP.activeId === id) APP.activeId = APP.sections.keys().next().value;
  renderAll(); clearPrev();
  showToast(`✖ "${sec.name}" fechada`);
}

/* ══════════════════════════════════════════════════════
   PREVIEW / BUILD
══════════════════════════════════════════════════════ */
function runPreview() {
  const sec = activeSec(); if (!sec) { showToast('⚠ Nenhuma seção'); return; }
  const html = buildFinalHTML(sec);
  const iframe = document.getElementById('prev-iframe');
  const empty  = document.getElementById('prev-empty');
  iframe.srcdoc = html;
  iframe.style.display = 'block';
  empty.style.display  = 'none';
  const now = new Date().toLocaleTimeString('pt-BR');
  document.getElementById('prev-status').textContent = `Atualizado às ${now}`;
  setStatus(`Preview · ${now}`);
  renderTabs();
  showToast('✅ Preview renderizado!');
  if (window.innerWidth <= 768) mobTab('preview');
}

function buildFinalHTML(sec) {
  const p  = new DOMParser(), s = new XMLSerializer();
  const dc = p.parseFromString(s.serializeToString(sec.parsedDoc), 'text/html');
  const cn = dc.querySelectorAll('[data-modulo]');
  sec.modules.forEach((mod, i) => {
    if (!cn[i]) return;
    if (!mod.currentHTML.trim()) { cn[i].remove(); return; }
    const ed = p.parseFromString(mod.currentHTML, 'text/html').body.firstElementChild;
    if (!ed) return;
    cn[i].parentNode.replaceChild(dc.importNode(ed, true), cn[i]);
  });
  return '<!DOCTYPE html>\n' + s.serializeToString(dc);
}

async function copyAll() {
  const sec = activeSec(); if (!sec) { showToast('⚠ Nenhuma seção'); return; }
  const html = buildFinalHTML(sec);
  try { await navigator.clipboard.writeText(html); showToast('📋 HTML copiado!'); }
  catch { fallbackCopy(html); showToast('📋 HTML copiado (fallback)!'); }
}

function downloadHTML() {
  const sec = activeSec(); if (!sec) { showToast('⚠ Nenhuma seção'); return; }
  const html = buildFinalHTML(sec);
  const a = Object.assign(document.createElement('a'), {
    href: URL.createObjectURL(new Blob([html], {type:'text/html;charset=utf-8'})),
    download: `htmlblox_${sec.name.replace(/\W+/g,'_')}_${new Date().toISOString().slice(0,10)}.html`
  });
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  showToast('💾 Download iniciado!');
}

/* ══════════════════════════════════════════════════════
   MODAIS
══════════════════════════════════════════════════════ */
function openAddModal() {
  APP.modalMode = 'add';
  document.getElementById('modal-title').textContent = 'Adicionar Módulo';
  document.getElementById('modal-body').innerHTML = `
    <div><label class="f-label">Nome do módulo</label>
    <input id="mn-n" class="f-in" placeholder="Ex: Qualidade, Estoque..."/></div>
    <div><label class="f-label">Código HTML do bloco</label>
    <textarea id="mn-h" class="f-in f-ta" placeholder='<div data-modulo="Nome">\n  ...\n</div>'></textarea>
    <p class="f-hint">Se não tiver <code>data-modulo</code>, será adicionado automaticamente.</p></div>`;
  openModal(); setTimeout(() => document.getElementById('mn-n')?.focus(), 80);
}

function openNewSectionModal() {
  APP.modalMode = 'ns';
  document.getElementById('modal-title').textContent = 'Nova Seção';
  document.getElementById('modal-body').innerHTML = `
    <div><label class="f-label">Nome da seção</label>
    <input id="ns-n" class="f-in" placeholder="Ex: Boletim 20/05, Relatório Semanal..."/></div>
    <div><label class="f-label">HTML completo</label>
    <textarea id="ns-h" class="f-in f-ta" placeholder="Cole o HTML completo. Blocos com data-modulo serão extraídos."></textarea>
    <p class="f-hint">Múltiplas seções abertas ao mesmo tempo — alterne pelo rodapé.</p></div>`;
  openModal(); setTimeout(() => document.getElementById('ns-n')?.focus(), 80);
}

function openModal() {
  document.getElementById('modal-ov').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal(ev) {
  if (ev && ev.target !== document.getElementById('modal-ov')) return;
  document.getElementById('modal-ov').classList.remove('open');
  document.body.style.overflow = '';
  APP.modalMode = null;
}

function modalConfirm() {
  if (APP.modalMode === 'ns') {
    const name = document.getElementById('ns-n')?.value.trim();
    const html = document.getElementById('ns-h')?.value.trim();
    if (!name) { showToast('⚠ Informe o nome'); return; }
    if (!html)  { showToast('⚠ Cole o HTML'); return; }
    const color = PAL[APP.sections.size % PAL.length];
    const sec   = createSection(name, html, color);
    APP.sections.set(sec.id, sec); APP.activeId = sec.id;
    closeModal(); renderAll(); clearPrev();
    showToast(`✅ "${name}" criada com ${sec.modules.length} módulo(s)`);

  } else if (APP.modalMode === 'add') {
    const sec  = activeSec(); if (!sec) return;
    const nome = document.getElementById('mn-n')?.value.trim();
    let   html = document.getElementById('mn-h')?.value.trim();
    if (!nome) { showToast('⚠ Informe o nome'); return; }
    if (!html)  { showToast('⚠ Cole o HTML'); return; }
    const tmp = new DOMParser().parseFromString(html, 'text/html');
    if (!tmp.body.firstElementChild?.hasAttribute('data-modulo'))
      html = `<div data-modulo="${esc(nome)}">${html}</div>`;
    sec.modules.push({ nome, node:null, originalHTML:html, currentHTML:html });
    closeModal(); renderModules(); renderTabs();
    setTimeout(() => {
      const idx = sec.modules.length - 1;
      document.getElementById(`mc-${sec.id}-${idx}`)?.scrollIntoView({behavior:'smooth',block:'center'});
    }, 120);
    showToast(`✅ Módulo "${nome}" adicionado`);
  }
}

/* ══════════════════════════════════════════════════════
   RESIZE HANDLE (desktop)
══════════════════════════════════════════════════════ */
function initResize() {
  const rh = document.getElementById('rh'); if (!rh) return;
  let drag = false, sx = 0, sw = 0;
  rh.addEventListener('mousedown', e => {
    drag = true; sx = e.clientX;
    sw = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--col'));
    rh.classList.add('drag'); document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none'; e.preventDefault();
  });
  document.addEventListener('mousemove', e => {
    if (!drag) return;
    const nw = Math.min(Math.max(sw + e.clientX - sx, 280), window.innerWidth * .62);
    document.documentElement.style.setProperty('--col', nw + 'px');
    rh.style.left = nw + 'px';
  });
  document.addEventListener('mouseup', () => {
    if (!drag) return;
    drag = false; rh.classList.remove('drag');
    document.body.style.cursor = ''; document.body.style.userSelect = '';
  });
}

/* ══════════════════════════════════════════════════════
   HELPERS
══════════════════════════════════════════════════════ */
function activeSec() { return APP.sections.get(APP.activeId) || null; }

function clearPrev() {
  document.getElementById('prev-iframe').style.display = 'none';
  document.getElementById('prev-empty').style.display = 'flex';
  document.getElementById('prev-status').textContent = '— não renderizado —';
}

function setStatus(m) {
  const el = document.getElementById('status-pill'); if (el) el.textContent = m;
}

let toastT = null;
function showToast(msg) {
  const t = document.getElementById('toast');
  clearTimeout(toastT);
  t.innerHTML = msg + '<span class="tbar"></span>';
  t.classList.add('show');
  toastT = setTimeout(() => t.classList.remove('show'), 3000);
}

function fallbackCopy(txt) {
  const ta = Object.assign(document.createElement('textarea'), { value:txt });
  ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0;';
  document.body.appendChild(ta); ta.select();
  document.execCommand('copy'); document.body.removeChild(ta);
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); runPreview(); }
  if (e.key === 'Escape') {
    const ov = document.getElementById('modal-ov');
    if (ov.classList.contains('open')) { ov.classList.remove('open'); document.body.style.overflow=''; }
  }
});
</script>
